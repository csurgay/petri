<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <title>PetriNet Simulator</title>
        <link rel="shortcut icon" href="doc/favicon.ico">
        <link rel="stylesheet" href="doc/style.css">
    </head>
    <body>
        <canvas id="petrinetCanvas"></canvas>
        <script>
        // Script loader: every script is revalidated with the server first
        // (cache: "no-cache"), so a changed file is always fetched fresh,
        // while an unchanged one costs only a short "304 Not Modified".
        // Scripts then run in this exact order, as plain <script> tags would.
        (function() {
            const files=[
                "js/bfs.js",
                "js/assertion.js",
                "js/coord.js",
                "js/util.js",
                "js/frame.js",
                "js/form.js",
                "js/baseform.js",
                "js/prefform.js",
                "js/bfsform.js",
                "js/splash.js",
                "js/help.js",
                "js/graphics.js",
                "js/event.js",
                "js/object.js",
                "js/textbox.js",
                "js/saveload.js",
                "js/selection.js",
                "js/contextmenu.js",
                "js/hintbar.js",
                "js/filemanager.js",
                "js/toolpalette.js",
                "js/gestures.js",
                "js/selftest.js",
                "js/animbuild.js",
                "js/storyboard.js",
                "js/mouse.js",
                "js/flow.js",
                "js/place.js",
                "js/transition.js",
                "js/petrinet.js",
                "js/label.js",
                "js/button.js",
                "js/buttonbar.js",
                "js/state.js",
                "js/status.js",
                "js/control.js",
                "js/main.js"
            ];
            const revalidate=f=>fetch(f,{cache:"no-cache"}).catch(()=>null);
            Promise.all(files.map(revalidate)).then(()=>{
                files.forEach(f=>{
                    const s=document.createElement("script");
                    s.src=f;
                    s.async=false;      // keep execution order
                    s.charset="utf-8";
                    document.body.appendChild(s);
                });
            });
        })();
        </script>
    </body>
</html>
